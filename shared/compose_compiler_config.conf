// Types the Compose compiler should treat as stable.
//
// Every model in this package is an immutable @Serializable data class whose
// fields are only ever replaced wholesale via copy(). Marking the package
// stable stops the compiler from recursing into their List/Map fields, which
// is what makes Message, User, Guild and Channel skippable composable
// parameters. Without this, every visible message row recomposes whenever any
// state anywhere in the app changes.
//
// Safety: this is only sound as long as nothing in the package is mutated in
// place. If a model ever gains a `var` or a mutable collection field that is
// written into, recomposition will silently stop. Prefer PersistentList.
me.lampu.lampcord.shared.model.*

// Monitors discovered from the compositor; replaced wholesale on refresh.
me.lampu.lampcord.utils.Monitor

name: Verify Android

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-android.yml'
      - '.github/workflows/reusable-android-build.yml'
      - '.github/actions/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'shared/**'
      - 'androidApp/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build-android.yml'
      - '.github/workflows/reusable-android-build.yml'
      - '.github/actions/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'shared/**'
      - 'androidApp/**'

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android
    uses: ./.github/workflows/reusable-android-build.yml
    permissions:
      contents: read
    with:
      variant: debug
      cache-read-only: ${{ github.event_name == 'pull_request' }}
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

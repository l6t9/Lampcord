name: Desktop Linux

on:
  workflow_call:
    inputs:
      upload-artifact:
        description: Upload packaged output as workflow artifacts
        required: false
        default: false
        type: boolean
      artifact-prefix:
        description: Prefix for workflow artifact names
        required: false
        default: ''
        type: string
      staging-release-tag:
        description: Draft release tag used for cross-job package handoff
        required: false
        default: ''
        type: string
      cache-read-only:
        description: Keep the Gradle cache read-only
        required: false
        default: false
        type: boolean
      package-native:
        description: >-
          Also build deb, rpm and pacman packages for distribution channels.
        required: false
        default: false
        type: boolean
      package-aur:
        description: >-
          Build an AUR source tarball from packaging/aur with pkgver and the AppImage
          checksum rewritten for this build.
        required: false
        default: false
        type: boolean
      version:
        description: >-
          Version to name the package after. Defaults to appVersion, which is the tester
          build identity. The release workflow passes its own release version so package
          names match the release tag.
        required: false
        default: ''
        type: string
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

jobs:
  package:
    name: AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare CI Gradle
        uses: ./.github/actions/prepare-ci-gradle
        with:
          cache-scope: desktop-linux
          cache-read-only: ${{ inputs.cache-read-only }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Prepare external libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 jq libarchive-tools ${{ inputs.package-native && 'rpm' || '' }}

          mkdir -p tools
          curl --fail --location --silent --show-error \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage" \
            --output tools/appimagetool.AppImage
          chmod +x tools/appimagetool.AppImage

      - name: Build Linux AppImage
        shell: bash
        run: ./gradlew :desktopApp:createAppImageLocal --no-daemon --no-build-cache --no-configuration-cache

      - name: Collect Linux AppImage
        id: package
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == "appVersion" ]]; then version="$value"; break; fi
          done < gradle.properties
          [[ -n "$VERSION_OVERRIDE" ]] && version="$VERSION_OVERRIDE"
          source="dist/Lampcord.AppImage"
          test -f "$source" || { echo "Linux AppImage was not produced" >&2; exit 1; }
          output="dist/lampcord-desktop-linux-x64-${version}.AppImage"
          mv "$source" "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Build native Linux packages
        if: inputs.package-native
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == "appVersion" ]]; then version="$value"; break; fi
          done < gradle.properties
          [[ -n "$VERSION_OVERRIDE" ]] && version="$VERSION_OVERRIDE"
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:packagePacman \
            --no-daemon --no-build-cache --no-configuration-cache
          mkdir -p dist/native
          binaries=desktopApp/build/compose/binaries/main
          for spec in "deb:*.deb" "rpm:*.rpm" "pacman:*.pkg.tar.zst"; do
            kind="${spec%%:*}"
            pattern="${spec#*:}"
            src=$(find "$binaries/$kind" -maxdepth 1 -name "$pattern" -type f | head -n 1)
            [[ -n "$src" ]] || { echo "No $kind package was produced" >&2; exit 1; }
            ext="${src##*.}"
            mv "$src" "dist/native/lampcord-desktop-linux-x64-${version}.${ext}"
          done
          ls -1 dist/native

      - name: Build AUR source tarball
        if: inputs.package-aur
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == "appVersion" ]]; then version="$value"; break; fi
          done < gradle.properties
          [[ -n "$VERSION_OVERRIDE" ]] && version="$VERSION_OVERRIDE"

          appimage="dist/lampcord-desktop-linux-x64-${version}.AppImage"
          test -f "$appimage" || { echo "Linux AppImage was not produced" >&2; exit 1; }

          staging="$(mktemp -d)"
          workdir="$staging/lampcord-bin"
          mkdir -p "$workdir"
          cp packaging/aur/PKGBUILD packaging/aur/lampcord.desktop packaging/aur/lampcord.png "$workdir/"

          # AUR packages are named with a release version, not a tester build version, so an
          # alpha appVersion would produce a PKGBUILD that no user can ever match to a tag.
          release_version="$version"
          if [[ "$release_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-a[0-9]+$ ]]; then
            release_version="${BASH_REMATCH[1]}"
          fi

          appimage_sha="$(sha256sum "$appimage" | cut -d' ' -f1)"

          python3 - \
            "$workdir/PKGBUILD" "$release_version" "$appimage_sha" \
            "$(sha256sum packaging/aur/lampcord.desktop | cut -d' ' -f1)" \
            "$(sha256sum packaging/aur/lampcord.png | cut -d' ' -f1)" <<'PY'
          import re
          import sys

          path, pkgver, appimage_sha, desktop_sha, icon_sha = sys.argv[1:6]
          with open(path, encoding="utf-8") as handle:
              text = handle.read()

          text = re.sub(r"^pkgver=.*$", f"pkgver={pkgver}", text, count=1, flags=re.M)
          text = re.sub(
              r"^sha256sums=\(.*?\)$",
              f"sha256sums=('{appimage_sha}'\n            '{desktop_sha}'\n            '{icon_sha}')",
              text,
              count=1,
              flags=re.M | re.S,
          )
          with open(path, "w", encoding="utf-8") as handle:
              handle.write(text)
          PY

          # The AppImage checksum must match the artifact this tarball is published beside,
          # otherwise makepkg fails for every AUR user.
          grep -q "'${appimage_sha}'" "$workdir/PKGBUILD" || {
            echo "PKGBUILD checksum rewrite failed" >&2
            exit 1
          }

          mkdir -p dist/aur
          tar -czf "dist/aur/lampcord-bin-${version}-aur.tar.gz" -C "$staging" "lampcord-bin"
          tar -tzf "dist/aur/lampcord-bin-${version}-aur.tar.gz" > /dev/null
          ls -1 dist/aur

      - name: Upload native Linux assets
        if: inputs.package-native && inputs.staging-release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
        run: gh release upload "$STAGING_RELEASE_TAG" dist/native/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload AUR source asset
        if: inputs.package-aur && inputs.staging-release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
        run: gh release upload "$STAGING_RELEASE_TAG" dist/aur/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload Linux artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}desktop-linux
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 4

      - name: Upload Linux staging asset
        if: inputs.staging-release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: gh release upload "$STAGING_RELEASE_TAG" "$PACKAGE_PATH" --clobber --repo "$GITHUB_REPOSITORY"

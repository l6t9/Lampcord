name: Desktop Linux

on:
  workflow_call:
    inputs:
      upload-artifact:
        description: Upload packaged output as workflow artifacts
        required: false
        default: false
        type: boolean
      artifact-prefix:
        description: Prefix for workflow artifact names
        required: false
        default: ''
        type: string
      staging-release-tag:
        description: Draft release tag used for cross-job package handoff
        required: false
        default: ''
        type: string
      cache-read-only:
        description: Keep the Gradle cache read-only
        required: false
        default: false
        type: boolean
      package-native:
        description: >-
          Also build deb, rpm and pacman packages for distribution channels.
        required: false
        default: false
        type: boolean
      package-aur:
        description: >-
          Build an AUR source tarball from packaging/aur with pkgver and the AppImage
          checksum rewritten for this build.
        required: false
        default: false
        type: boolean
      version:
        description: >-
          Version to name the package after. Defaults to appVersion, which is the tester
          build identity. The release workflow passes its own release version so package
          names match the release tag.
        required: false
        default: ''
        type: string
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

jobs:
  package:
    name: AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare CI Gradle
        uses: ./.github/actions/prepare-ci-gradle
        with:
          cache-scope: desktop-linux
          cache-read-only: ${{ inputs.cache-read-only }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Prepare external libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 jq libarchive-tools ${{ inputs.package-native && 'rpm' || '' }}

          mkdir -p tools
          curl --fail --location --silent --show-error \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage" \
            --output tools/appimagetool.AppImage
          chmod +x tools/appimagetool.AppImage

      - name: Build Linux AppImage
        shell: bash
        run: ./gradlew :desktopApp:createAppImageLocal --no-daemon --no-build-cache --no-configuration-cache

      - name: Collect Linux AppImage
        id: package
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == "appVersion" ]]; then version="$value"; break; fi
          done < gradle.properties
          [[ -n "$VERSION_OVERRIDE" ]] && version="$VERSION_OVERRIDE"
          source="dist/Lampcord.AppImage"
          test -f "$source" || { echo "Linux AppImage was not produced" >&2; exit 1; }
          output="dist/lampcord-desktop-linux-x64-${version}.AppImage"
          mv "$source" "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Build native Linux packages
        if: inputs.package-native
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == "appVersion" ]]; then version="$value"; break; fi
          done < gradle.properties
          [[ -n "$VERSION_OVERRIDE" ]] && version="$VERSION_OVERRIDE"

          ./gradlew :desktopApp:packageUberJarForCurrentOS \
            --no-daemon --no-build-cache --no-configuration-cache

          jar=$(find desktopApp/build/compose/jars -maxdepth 1 -name '*.jar' -type f | head -n 1)
          [[ -n "$jar" ]] || { echo "No uber jar was produced" >&2; exit 1; }

          mkdir -p dist/native
          ./scripts/package_linux.sh --version "$version" --jar "$jar" --out dist/native

          # Publish the jar itself. packaging/aur/PKGBUILD fetches it straight from the
          # release assets rather than building it, so without this the AUR package 404s.
          # The upload step below globs dist/native/*, so leaving it here is enough. The name
          # matches the one the release assets use, which is what the PKGBUILD source= URL
          # expects.
          cp "$jar" "dist/native/lampcord-desktop-linux-x64-${version}.jar"
          ls -1 dist/native

      - name: Build AUR source tarball
        if: inputs.package-aur
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == "appVersion" ]]; then version="$value"; break; fi
          done < gradle.properties
          [[ -n "$VERSION_OVERRIDE" ]] && version="$VERSION_OVERRIDE"

          # The AUR package consumes the uber jar, the same artifact deb and rpm are built
          # from, rather than renaming an AppImage. That drops fuse2 from the dependency
          # list and makes all four Linux packages one layout.
          jar="dist/native/lampcord-desktop-linux-x64-${version}.jar"
          if [[ ! -f "$jar" ]]; then
            jar=$(find desktopApp/build/compose/jars -maxdepth 1 -name '*.jar' -type f | head -n 1)
          fi
          test -f "$jar" || { echo "No uber jar was produced" >&2; exit 1; }

          staging="$(mktemp -d)"
          workdir="$staging/lampcord-bin"
          mkdir -p "$workdir"
          cp packaging/aur/PKGBUILD packaging/aur/lampcord-launcher packaging/aur/lampcord.desktop \
            packaging/aur/lampcord.png "$workdir/"

          # AUR packages are named with a release version, not a tester build version, so an
          # alpha appVersion would produce a PKGBUILD that no user can ever match to a tag.
          release_version="$version"
          if [[ "$release_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-a[0-9]+$ ]]; then
            release_version="${BASH_REMATCH[1]}"
          fi

          # Source order must match the PKGBUILD's source=() array.
          jar_sha="$(sha256sum "$jar" | cut -d' ' -f1)"
          launcher_sha="$(sha256sum packaging/aur/lampcord-launcher | cut -d' ' -f1)"
          desktop_sha="$(sha256sum packaging/aur/lampcord.desktop | cut -d' ' -f1)"
          icon_sha="$(sha256sum packaging/aur/lampcord.png | cut -d' ' -f1)"

          python3 - \
            "$workdir/PKGBUILD" "$release_version" "$jar_sha" "$launcher_sha" \
            "$desktop_sha" "$icon_sha" <<'PY'
          import re
          import sys

          path, pkgver, jar_sha, launcher_sha, desktop_sha, icon_sha = sys.argv[1:7]
          with open(path, encoding="utf-8") as handle:
              text = handle.read()

          text = re.sub(r"^pkgver=.*$", f"pkgver={pkgver}", text, count=1, flags=re.M)
          text = re.sub(
              r"^sha256sums=\(.*?\)$",
              "sha256sums=('{}'\n            '{}'\n            '{}'\n            '{}')".format(
                  jar_sha, launcher_sha, desktop_sha, icon_sha
              ),
              text,
              count=1,
              flags=re.M | re.S,
          )
          with open(path, "w", encoding="utf-8") as handle:
              handle.write(text)
          PY

          # Every checksum must have been substituted, and the jar's has to match the artifact
          # this tarball is published beside, otherwise makepkg fails for every AUR user.
          if grep -q 'REPLACED_BY_CI' "$workdir/PKGBUILD"; then
            echo "PKGBUILD still contains placeholder checksums" >&2
            exit 1
          fi
          grep -q "'${jar_sha}'" "$workdir/PKGBUILD" || {
            echo "PKGBUILD jar checksum rewrite failed" >&2
            exit 1
          }
          for sha in "$launcher_sha" "$desktop_sha" "$icon_sha"; do
            grep -q "'${sha}'" "$workdir/PKGBUILD" || {
              echo "PKGBUILD is missing checksum ${sha}" >&2
              exit 1
            }
          done

          mkdir -p dist/aur
          tar -czf "dist/aur/lampcord-bin-${version}-aur.tar.gz" -C "$staging" "lampcord-bin"
          tar -tzf "dist/aur/lampcord-bin-${version}-aur.tar.gz" > /dev/null
          ls -1 dist/aur

      - name: Upload native Linux assets
        if: inputs.package-native && inputs.staging-release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
        run: gh release upload "$STAGING_RELEASE_TAG" dist/native/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload AUR source asset
        if: inputs.package-aur && inputs.staging-release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
        run: gh release upload "$STAGING_RELEASE_TAG" dist/aur/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload Linux artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}desktop-linux
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 4

      - name: Upload Linux staging asset
        if: inputs.staging-release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: gh release upload "$STAGING_RELEASE_TAG" "$PACKAGE_PATH" --clobber --repo "$GITHUB_REPOSITORY"

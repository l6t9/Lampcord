name: Release

on:
  push:
    branches: [ main ]
    paths:
      - gradle.properties
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish (must match releaseVersion)
        required: true
        type: string
      publish-existing:
        description: >-
          Publish the packages already in the tester-package-staging draft instead of
          rebuilding them. Use after a failure that happened at or after packaging, such as
          running out of Actions budget during publish.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should-release: ${{ steps.release.outputs.should-release }}
      version: ${{ steps.release.outputs.version }}
      build-version: ${{ steps.release.outputs.build-version }}
      base-sha: ${{ steps.release.outputs.base-sha }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release range
        id: release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases can only run from the main branch" >&2
            exit 1
          fi

          read_prop() {
            local wanted="$1"
            while IFS='=' read -r key value; do
              if [[ "$key" == "$wanted" ]]; then
                printf '%s' "$value"
                return
              fi
            done
          }

          # Strict semver both sides; an appVersion alpha must never be publishable.
          is_forward_version() {
            local previous="$1"
            local current="$2"
            local previous_major previous_minor previous_patch
            local current_major current_minor current_patch

            [[ "$previous" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || return 1
            previous_major="${BASH_REMATCH[1]}"
            previous_minor="${BASH_REMATCH[2]}"
            previous_patch="${BASH_REMATCH[3]}"

            [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || return 1
            current_major="${BASH_REMATCH[1]}"
            current_minor="${BASH_REMATCH[2]}"
            current_patch="${BASH_REMATCH[3]}"

            if ((10#$current_major != 10#$previous_major)); then
              ((10#$current_major > 10#$previous_major))
              return
            fi
            if ((10#$current_minor != 10#$previous_minor)); then
              ((10#$current_minor > 10#$previous_minor))
              return
            fi
            ((10#$current_patch > 10#$previous_patch))
          }

          find_previous_release_base() {
            local current_version="$1"
            local search_head="$2"
            local commit candidate_version previous_version

            while IFS= read -r commit; do
              candidate_version="$(git show "${commit}:gradle.properties" | read_prop releaseVersion)"
              previous_version="$(git show "${commit}^:gradle.properties" 2>/dev/null | read_prop releaseVersion || true)"
              if is_forward_version "$previous_version" "$candidate_version" &&
                is_forward_version "$candidate_version" "$current_version"; then
                printf '%s' "$commit"
                return
              fi
            done < <(git log -G '^releaseVersion=' --format='%H' "$search_head" -- gradle.properties)
          }

          version="$(read_prop releaseVersion < gradle.properties)"
          build_version="$(read_prop appVersion < gradle.properties)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            {
              echo "should-release=false"
              echo "version=$version"
              echo "build-version=$build_version"
              echo "base-sha="
            } >> "$GITHUB_OUTPUT"
            echo "Skipping release: releaseVersion \`$version\` is not a plain X.Y.Z version." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$REQUESTED_VERSION" == "$version" ]] || {
              echo "Requested version $REQUESTED_VERSION does not match releaseVersion $version" >&2
              exit 1
            }
            should_release=true
          else
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              should_release=true
            else
              previous_version="$(git show "$BEFORE_SHA:gradle.properties" 2>/dev/null | read_prop releaseVersion || true)"
              if [[ -z "$previous_version" ]]; then
                should_release=true
              elif is_forward_version "$previous_version" "$version"; then
                should_release=true
              else
                should_release=false
                echo "Skipping release: releaseVersion $previous_version -> $version is not a forward version." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi

          version_commit="$(git log -G '^releaseVersion=' --format='%H' -1 "$GITHUB_SHA" -- gradle.properties)"
          base_sha="$(find_previous_release_base "$version" "${version_commit}^")"
          if [[ -z "$base_sha" ]]; then
            base_sha="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
          fi

          {
            echo "should-release=$should_release"
            echo "version=$version"
            echo "build-version=$build_version"
            echo "base-sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release"
            echo "- Release version: \`$version\`"
            echo "- Build version (appVersion): \`$build_version\`"
            echo "- Commit range: \`${base_sha:0:8}..$GITHUB_SHA:0:8\`"
            echo "- Publish: \`$should_release\`"
          } >> "$GITHUB_STEP_SUMMARY"

  stage:
    name: Create package staging release
    if: needs.prepare.outputs.should-release == 'true' && inputs.publish-existing != true
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Create draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          tag="tester-package-staging"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > /dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
          fi
          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Lampcord $APP_VERSION package staging" \
            --notes "Temporary package handoff for Actions run $GITHUB_RUN_ID." \
            --repo "$GITHUB_REPOSITORY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  android:
    name: Android
    if: needs.prepare.outputs.should-release == 'true' && inputs.publish-existing != true
    needs:
      - prepare
      - stage
    uses: ./.github/workflows/reusable-android-build.yml
    permissions:
      contents: write
    with:
      variant: release
      version: ${{ needs.prepare.outputs.version }}
      staging-release-tag: ${{ needs.stage.outputs.tag }}
      require-signing: true
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

  linux:
    name: Linux
    if: needs.prepare.outputs.should-release == 'true' && inputs.publish-existing != true
    needs:
      - prepare
      - stage
    uses: ./.github/workflows/reusable-desktop-linux.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      staging-release-tag: ${{ needs.stage.outputs.tag }}
      package-native: true
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  windows:
    name: Windows
    if: needs.prepare.outputs.should-release == 'true' && inputs.publish-existing != true
    needs:
      - prepare
      - stage
    uses: ./.github/workflows/reusable-desktop-windows.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      staging-release-tag: ${{ needs.stage.outputs.tag }}
      package-native: true
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  publish:
    name: Publish release
    if: always() && needs.prepare.outputs.should-release == 'true'
    needs:
      - prepare
      - stage
      - android
      - linux
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download staged packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ needs.stage.outputs.tag || 'tester-package-staging' }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$STAGING_RELEASE_TAG" --dir release-assets --repo "$GITHUB_REPOSITORY"

      - name: Validate publication inputs
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build-version }}
          STAGING_RELEASE_TAG: ${{ needs.stage.outputs.tag || 'tester-package-staging' }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$PIXELDRAIN_API_KEY" || { echo "PIXELDRAIN_API_KEY is not configured" >&2; exit 1; }
          test -n "$DISCORD_WEBHOOK_URL" || { echo "DISCORD_WEBHOOK_URL is not configured" >&2; exit 1; }

          # The package jobs name their output after the release version, so the tag and
          # the file names agree. build-version is recorded in build-info.json only.
          expected=(
            "release-assets/lampcord-android-${APP_VERSION}.apk"
            "release-assets/lampcord-desktop-linux-x64-${APP_VERSION}.AppImage"
            "release-assets/lampcord-desktop-windows-x64-${APP_VERSION}.zip"
          )
          for file in "${expected[@]}"; do
            if [[ ! -f "$file" ]]; then
              {
                echo "Missing release artifact: $file"
                echo "Expected release version: $APP_VERSION (from releaseVersion)"
                echo "Build version recorded as: $BUILD_VERSION (appVersion)"
                echo "Staging tag: $STAGING_RELEASE_TAG"
                echo "Files actually downloaded:"
                ls -1 release-assets >&2 || echo "  (none)" >&2
              } >&2
              exit 1
            fi
          done

      - name: Generate full changelog
        shell: bash
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base-sha }}
        run: |
          set -euo pipefail
          git log "$BASE_SHA..$GITHUB_SHA" > release-assets/CHANGELOG.md

      - name: Create release metadata
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build-version }}
          BASE_SHA: ${{ needs.prepare.outputs.base-sha }}
        run: |
          set -euo pipefail
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg version "$APP_VERSION" \
            --arg buildVersion "$BUILD_VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg base_commit "$BASE_SHA" \
            --arg actor "$GITHUB_ACTOR" \
            --arg built_at "$built_at" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{version: $version, buildVersion: $buildVersion, commit: $commit, baseCommit: $base_commit, actor: $actor, builtAt: $built_at, runUrl: $run_url}' \
            > "release-assets/lampcord-${APP_VERSION}-build-info.json"
          (
            cd release-assets
            sha256sum -- * > SHA256SUMS
          )

      - name: Upload Android APK to Pixeldrain
        id: pixeldrain-android
        uses: ./.github/actions/upload-pixeldrain
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        with:
          file-path: release-assets/lampcord-android-${{ needs.prepare.outputs.version }}.apk

      - name: Upload Linux AppImage to Pixeldrain
        id: pixeldrain-linux
        uses: ./.github/actions/upload-pixeldrain
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        with:
          file-path: release-assets/lampcord-desktop-linux-x64-${{ needs.prepare.outputs.version }}.AppImage

      - name: Upload Windows ZIP to Pixeldrain
        id: pixeldrain-windows
        uses: ./.github/actions/upload-pixeldrain
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        with:
          file-path: release-assets/lampcord-desktop-windows-x64-${{ needs.prepare.outputs.version }}.zip

      - name: Upload checksums to Pixeldrain
        id: pixeldrain-checksums
        uses: ./.github/actions/upload-pixeldrain
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        with:
          file-path: release-assets/SHA256SUMS
          upload-filename: lampcord-${{ needs.prepare.outputs.version }}-SHA256SUMS.txt

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY"
          fi
          gh release create "$tag" \
            release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Lampcord $APP_VERSION" \
            --notes-file release-assets/CHANGELOG.md \
            --repo "$GITHUB_REPOSITORY"

      - name: Notify on Discord
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATE_WEBHOOK_URL }}
          ANDROID_URL: ${{ steps.pixeldrain-android.outputs.pixeldrain_url }}
          LINUX_URL: ${{ steps.pixeldrain-linux.outputs.pixeldrain_url }}
          WINDOWS_URL: ${{ steps.pixeldrain-windows.outputs.pixeldrain_url }}
          CHECKSUMS_URL: ${{ steps.pixeldrain-checksums.outputs.pixeldrain_url }}
        run: |
          set -euo pipefail
          
          role1="1534704702585966642"
          role2="1534740463481913415"
          role3="1534719840307253359"

          downloads="$(printf '%s\n%s\n%s' \
            "[Android]($ANDROID_URL)" \
            "[Windows x64]($WINDOWS_URL) | [Linux x64]($LINUX_URL)" \
            "[SHA-256 checksums]($CHECKSUMS_URL)")"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          jq -n \
            --arg content "<@&$role1> <@&$role2> <@&$role3>" \
            --arg role1 "$role1" \
            --arg role2 "$role2" \
            --arg role3 "$role3" \
            --arg title "Lampcord $APP_VERSION is ready" \
            --arg downloads "$downloads" \
            --arg build "[$GITHUB_SHA]($run_url) triggered by $GITHUB_ACTOR" \
            --arg timestamp "$timestamp" \
            '{
              content: $content,
              allowed_mentions: {parse: [], roles: [$role1, $role2, $role3]},
              embeds: [{
                title: $title,
                color: 5793266,
                fields: [
                  {name: "Downloads", value: $downloads},
                  {name: "Build", value: $build}
                ],
                timestamp: $timestamp
              }]
            }' > discord-payload.json

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            -H "Content-Type: application/json" \
            --data-binary @discord-payload.json \
            --output /dev/null \
            "$DISCORD_WEBHOOK_URL"

  cleanup-staging:
    name: Clean up package staging release
    if: always() && needs.prepare.outputs.should-release == 'true' && inputs.publish-existing != true
    needs:
      - prepare
      - stage
      - android
      - linux
      - windows
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete package staging release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: tester-package-staging
        run: |
          set -euo pipefail
          if gh release view "$STAGING_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$STAGING_RELEASE_TAG" --yes --repo "$GITHUB_REPOSITORY"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${STAGING_RELEASE_TAG}" > /dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${STAGING_RELEASE_TAG}"
          fi

name: Verify Desktop

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-desktop.yml'
      - '.github/workflows/reusable-desktop-linux.yml'
      - '.github/workflows/reusable-desktop-macos.yml'
      - '.github/actions/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'shared/**'
      - 'desktopApp/**'
      - 'native/**'
      - 'scripts/build_icons.sh'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build-desktop.yml'
      - '.github/workflows/reusable-desktop-linux.yml'
      - '.github/workflows/reusable-desktop-macos.yml'
      - '.github/actions/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'shared/**'
      - 'desktopApp/**'
      - 'native/**'
      - 'scripts/build_icons.sh'
  workflow_dispatch:
    inputs:
      platform:
        description: Which desktop platform to build
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A manual run is never cancelled by a later push, so a single-platform retry started from
  # this workflow is not killed halfway through by unrelated commits landing on main.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  linux:
    name: Linux
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    uses: ./.github/workflows/reusable-desktop-linux.yml
    permissions:
      contents: read
    with:
      upload-artifact: true
      cache-read-only: ${{ github.event_name == 'pull_request' }}
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  windows:
    name: Windows
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    uses: ./.github/workflows/reusable-desktop-windows.yml
    permissions:
      contents: read
    with:
      upload-artifact: true
      cache-read-only: ${{ github.event_name == 'pull_request' }}
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  macos:
    name: macOS
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    uses: ./.github/workflows/reusable-desktop-macos.yml
    permissions:
      contents: read
    with:
      upload-artifact: true
      cache-read-only: ${{ github.event_name == 'pull_request' }}
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

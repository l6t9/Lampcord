name: Verify Desktop

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-desktop.yml'
      - '.github/workflows/reusable-desktop-linux.yml'
      - '.github/actions/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'shared/**'
      - 'desktopApp/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build-desktop.yml'
      - '.github/workflows/reusable-desktop-linux.yml'
      - '.github/actions/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'shared/**'
      - 'desktopApp/**'

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Desktop
    uses: ./.github/workflows/reusable-desktop-linux.yml
    permissions:
      contents: read
    with:
      upload-artifact: true
      cache-read-only: ${{ github.event_name == 'pull_request' }}
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

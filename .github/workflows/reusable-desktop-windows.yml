name: Desktop Windows

on:
  workflow_call:
    inputs:
      upload-artifact:
        description: Upload packaged output as workflow artifacts
        required: false
        default: false
        type: boolean
      artifact-prefix:
        description: Prefix for workflow artifact names
        required: false
        default: ''
        type: string
      staging-release-tag:
        description: Draft release tag used for cross-job package handoff
        required: false
        default: ''
        type: string
      cache-read-only:
        description: Keep the Gradle cache read-only
        required: false
        default: false
        type: boolean
      package-native:
        description: >-
          Also build the NSIS installer for distribution. Off for nightly so the updater's
          portable zip keeps building fast.
        required: false
        default: false
        type: boolean
      version:
        description: >-
          Version to name the package after. Defaults to appVersion, which is the tester
          build identity. The release workflow passes its own release version so package
          names match the release tag.
        required: false
        default: ''
        type: string
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

jobs:
  package:
    name: ZIP
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare CI Gradle
        uses: ./.github/actions/prepare-ci-gradle
        with:
          cache-scope: desktop-windows
          cache-read-only: ${{ inputs.cache-read-only }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build Windows portable package
        shell: bash
        run: ./gradlew :desktopApp:createDistributable --no-daemon --no-build-cache --no-configuration-cache

      - name: Package Windows ZIP
        shell: pwsh
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          $version = ""
          Get-Content gradle.properties | ForEach-Object {
            if ($_ -match "appVersion=(.*)") { $version = $matches[1] }
          }
          if ($env:VERSION_OVERRIDE) { $version = $env:VERSION_OVERRIDE }
          $appDir = "desktopApp/build/compose/binaries/main/app/Lampcord"
          $zipPath = "dist/lampcord-desktop-windows-x64-$version.zip"
          mkdir -p dist
          Compress-Archive -Path "$appDir\*" -DestinationPath "$zipPath" -Force
          "path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: package

      - name: Build Windows NSIS installer
        if: inputs.package-native
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == "appVersion" ]]; then version="$value"; break; fi
          done < gradle.properties
          [[ -n "$VERSION_OVERRIDE" ]] && version="$VERSION_OVERRIDE"
          ./gradlew :desktopApp:packageDistributionForCurrentOS \
            --no-daemon --no-build-cache --no-configuration-cache
          installer=$(find desktopApp/build/compose/binaries/main/nsis -maxdepth 1 -name '*.exe' | head -1)
          [[ -n "$installer" ]] || { echo "No NSIS installer was produced" >&2; exit 1; }
          mkdir -p dist/native
          mv "$installer" "dist/native/lampcord-desktop-windows-x64-${version}-setup.exe"

      - name: Upload Windows installer asset
        if: inputs.package-native && inputs.staging-release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
        run: gh release upload "$STAGING_RELEASE_TAG" dist/native/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload Windows artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}desktop-windows
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 4

      - name: Upload Windows staging asset
        if: inputs.staging-release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: gh release upload "$STAGING_RELEASE_TAG" "$PACKAGE_PATH" --clobber --repo "$GITHUB_REPOSITORY"

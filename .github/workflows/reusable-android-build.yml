name: Reusable Android Build

on:
  workflow_call:
    inputs:
      variant:
        description: Android build variant
        required: false
        default: debug
        type: string
      upload-artifact:
        description: Upload the APK as a workflow artifact
        required: false
        default: false
        type: boolean
      artifact-name:
        description: Workflow artifact name
        required: false
        default: android-build
        type: string
      staging-release-tag:
        description: Draft release tag used for cross-job package handoff
        required: false
        default: ''
        type: string
      cache-read-only:
        description: Keep the Gradle cache read-only
        required: false
        default: false
        type: boolean
      version:
        description: >-
          Version to name the package after. Defaults to appVersion, which is the tester
          build identity. The release workflow passes its own release version so package
          names match the release tag.
        required: false
        default: ''
        type: string
      require-signing:
        description: Fail unless the release APK is signed
        required: false
        default: false
        type: boolean
      nightly-build:
        description: Monotonic nightly build number that drives versionCode and versionName
        required: false
        default: ''
        type: string
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false
      KEYSTORE_PATH:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

jobs:
  build:
    name: APK
    runs-on: ubuntu-latest
    # A cold runner installs the NDK and CMake, then builds four ABIs of native
    # voice code before R8 minifies. That does not fit in 15 minutes.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate build configuration
        id: config
        shell: bash
        env:
          BUILD_VARIANT: ${{ inputs.variant }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_VARIANT" != "debug" && "$BUILD_VARIANT" != "release" ]]; then
            echo "Unsupported Android variant: $BUILD_VARIANT" >&2
            exit 1
          fi

          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == "appVersion" ]]; then
              version="$value"
              break
            fi
          done < gradle.properties
          [[ -n "$VERSION_OVERRIDE" ]] && version="$VERSION_OVERRIDE"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-a[0-9]+|-nightly\.[0-9]+)?$ ]] || {
            echo "Invalid package version: $version" >&2
            exit 1
          }

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Gradle's build cache does not cover CMake/ninja output, and the voice library is
      # built for four ABIs. Caching the CMake tree lets ninja skip the compile on warm runs.
      # Keyed on the native sources plus the NDK and CMake versions, since a toolchain bump
      # invalidates every object file.
      - name: Restore native build tree
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: androidApp/.cxx
          key: android-native-${{ runner.os }}-${{ inputs.variant }}-ndk27.2.12479018-cmake3.22.1-${{ hashFiles('native/voice/**', 'androidApp/build.gradle.kts') }}
          restore-keys: |
            android-native-${{ runner.os }}-${{ inputs.variant }}-ndk27.2.12479018-cmake3.22.1-

      - name: Prepare CI Gradle
        uses: ./.github/actions/prepare-ci-gradle
        with:
          cache-scope: android-${{ inputs.variant }}
          cache-read-only: ${{ inputs.cache-read-only }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          persist-configuration-cache: ${{ inputs.variant != 'release' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Prepare Android signing
        if: inputs.variant == 'release'
        id: signing
        uses: ./.github/actions/prepare-android-signing
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Require Android signing
        if: inputs.variant == 'release' && inputs.require-signing && steps.signing.outputs.signing_available != 'true'
        shell: bash
        run: |
          echo "Android release signing credentials are required" >&2
          exit 1

      - name: Build APK
        shell: bash
        env:
          BUILD_VARIANT: ${{ inputs.variant }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NIGHTLY_BUILD: ${{ inputs.nightly-build }}
        run: |
          set -euo pipefail
          extra_args=()
          if [[ "$BUILD_VARIANT" == "release" ]]; then
            task=":androidApp:assembleRelease"
            extra_args=(--no-configuration-cache)
            extra_args+=(-x :androidApp:lintVitalRelease)
            # x86 and x86_64 only exist so the app installs on desktop emulators. Shipping
            # them doubles the native build for ABIs no real device uses.
            extra_args+=(-PvoiceAbis=arm64-v8a,armeabi-v7a)
          else
            task=":androidApp:assembleDebug"
          fi
          if [[ "$NIGHTLY_BUILD" =~ ^[0-9]+$ ]]; then
            extra_args+=(-PnightlyBuild="$NIGHTLY_BUILD")
          fi
          ./gradlew "$task" --no-daemon "${extra_args[@]}"

      - name: Collect APK
        id: apk
        shell: bash
        env:
          BUILD_VARIANT: ${{ inputs.variant }}
          APP_VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -euo pipefail
          files=(androidApp/build/outputs/apk/"$BUILD_VARIANT"/*.apk)
          test -f "${files[0]}" || { echo "Android APK was not produced" >&2; exit 1; }
          mkdir -p dist
          if [[ "$BUILD_VARIANT" == "release" ]]; then
            primary="$(ls androidApp/build/outputs/apk/"$BUILD_VARIANT"/*universal*.apk 2>/dev/null | head -n 1 || ls androidApp/build/outputs/apk/"$BUILD_VARIANT"/*.apk | head -n 1)"
            output="dist/lampcord-android-${APP_VERSION}.apk"
            cp "$primary" "$output"
            for f in "${files[@]}"; do
              cp "$f" "dist/"
            done
          else
            output="dist/lampcord-android-${APP_VERSION}-debug.apk"
            cp "${files[0]}" "$output"
          fi
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        if: inputs.variant == 'release' && inputs.require-signing
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          apksigners=("$ANDROID_HOME"/build-tools/*/apksigner)
          test -x "${apksigners[-1]}" || { echo "apksigner was not found" >&2; exit 1; }
          "${apksigners[-1]}" verify --verbose --print-certs "$APK_PATH"

      - name: Upload Android artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 4

      - name: Remove previous nightly APKs
        if: inputs.staging-release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
          PACKAGE_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          current="$(basename "$PACKAGE_PATH")"
          old_assets=$(gh release view "$STAGING_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -E '^lampcord-android-.*-nightly\.[0-9]+\.apk$' \
            | grep -v -F "$current" || true)
          if [[ -n "$old_assets" ]]; then
            while IFS= read -r old; do
              [[ -z "$old" ]] && continue
              echo "Removing $old"
              gh release delete-asset "$STAGING_RELEASE_TAG" "$old" --repo "$GITHUB_REPOSITORY" --yes
            done <<< "$old_assets"
          fi

      - name: Upload Android staging asset
        if: inputs.staging-release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
          PACKAGE_PATH: ${{ steps.apk.outputs.path }}
        run: gh release upload "$STAGING_RELEASE_TAG" "$PACKAGE_PATH" --clobber --repo "$GITHUB_REPOSITORY"

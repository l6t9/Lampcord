name: Nightly Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  stage:
    name: Prepare Nightly Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      android_changed: ${{ steps.changes.outputs.android_changed }}
      linux_changed: ${{ steps.changes.outputs.linux_changed }}
      windows_changed: ${{ steps.changes.outputs.windows_changed }}
      macos_changed: ${{ steps.changes.outputs.macos_changed }}
      ios_changed: ${{ steps.changes.outputs.ios_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Detect changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          sha="${{ github.sha }}"
          changed_files=()

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            android_changed=true
            linux_changed=true
            windows_changed=true
            macos_changed=true
            ios_changed=true
          else
            if [[ -n "$before" && "$before" != "00000000000000000000000000000000000000000" ]]; then
              changed_files=$(git diff --name-only "$before" "$sha" 2>/dev/null || true)
            fi
            if [[ -z "$changed_files" ]]; then
              changed_files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            fi

            android_changed=false
            linux_changed=false
            windows_changed=false
            macos_changed=false
            ios_changed=false

            while IFS= read -r f; do
              [[ -z "$f" ]] && continue

              case "$f" in
                androidApp/**|shared/androidMain/**|shared/src/androidMain/**|native/**)
                  android_changed=true
                  ;;
              esac

              case "$f" in
                desktopApp/**|shared/desktopMain/**|shared/jvmMain/**|shared/src/desktopMain/**|shared/src/jvmMain/**|scripts/**|packaging/**)
                  linux_changed=true
                  windows_changed=true
                  macos_changed=true
                  ;;
              esac

              case "$f" in
                iosApp/**|shared/iosMain/**|shared/src/iosMain/**)
                  ios_changed=true
                  ;;
              esac

              case "$f" in
                shared/commonMain/**|shared/src/commonMain/**)
                  android_changed=true
                  linux_changed=true
                  windows_changed=true
                  macos_changed=true
                  ios_changed=true
                  ;;
                build.gradle.kts|build.gradle|gradle.properties|settings.gradle.kts|settings.gradle|gradle/**|.github/workflows/reusable-*.yml|.github/workflows/nightly-release.yml|.github/actions/**)
                  android_changed=true
                  linux_changed=true
                  windows_changed=true
                  macos_changed=true
                  ios_changed=true
                  ;;
              esac
            done <<< "$changed_files"

            if [[ -z "$changed_files" ]]; then
              android_changed=true
              linux_changed=true
              windows_changed=true
              macos_changed=true
              ios_changed=true
            fi
          fi

          echo "android_changed=$android_changed" >> "$GITHUB_OUTPUT"
          echo "linux_changed=$linux_changed" >> "$GITHUB_OUTPUT"
          echo "windows_changed=$windows_changed" >> "$GITHUB_OUTPUT"
          echo "macos_changed=$macos_changed" >> "$GITHUB_OUTPUT"
          echo "ios_changed=$ios_changed" >> "$GITHUB_OUTPUT"

      - name: Ensure nightly release exists
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == "appVersion" ]]; then version="$value"; break; fi
          done < gradle.properties
          version="${version}-nightly.${{ github.run_number }}"
          tag="v${version}"

          previous=""
          if latest_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 10 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' | head -n 1 2>/dev/null)"; then
            if [[ -n "$latest_tag" ]]; then
              previous="$(gh release view "$latest_tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
            fi
          fi

          notes=""
          if [[ -n "$previous" && "$previous" != "$GITHUB_SHA" ]]; then
            notes="$(gh api "repos/$GITHUB_REPOSITORY/compare/${previous}...${GITHUB_SHA}" \
              --jq '[.commits[] | (.commit.message | split("\n")[0])] | .[:20] | join("\n")' 2>/dev/null || true)"
          fi

          {
            printf 'Automated nightly build generated from commit `%s` on %s.\n\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%d %H:%M UTC')"
            printf "### What's new\n\n"
            if [[ -n "$notes" ]]; then
              printf '%s\n' "$notes"
            else
              printf 'No user-facing changes since the last nightly.\n'
            fi
          } > notes.md

          title="Lampcord Nightly ($version)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$tag" --target "$GITHUB_SHA" --prerelease --title "$title" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    name: Android
    needs: stage
    if: needs.stage.outputs.android_changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-android-build.yml
    permissions:
      contents: write
    with:
      variant: release
      staging-release-tag: ${{ needs.stage.outputs.tag }}
      version: ${{ needs.stage.outputs.version }}
      nightly-build: ${{ github.run_number }}
      require-signing: false
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

  linux:
    name: Linux
    needs: stage
    if: needs.stage.outputs.linux_changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-desktop-linux.yml
    permissions:
      contents: write
    with:
      staging-release-tag: ${{ needs.stage.outputs.tag }}
      package-native: true
      package-aur: true
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  windows:
    name: Windows
    needs: stage
    if: needs.stage.outputs.windows_changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-desktop-windows.yml
    permissions:
      contents: write
    with:
      staging-release-tag: ${{ needs.stage.outputs.tag }}
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  ios:
    name: iOS
    needs: stage
    if: needs.stage.outputs.ios_changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-ios-build.yml
    permissions:
      contents: write
    with:
      build-ipa: true
      staging-release-tag: ${{ needs.stage.outputs.tag }}
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  macos:
    name: macOS
    needs: stage
    if: needs.stage.outputs.macos_changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-desktop-macos.yml
    permissions:
      contents: write
    with:
      staging-release-tag: ${{ needs.stage.outputs.tag }}
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  finalize:
    name: Finalize Release
    needs: [stage, android, linux, windows, ios, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Sync to nightly-latest rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.stage.outputs.tag }}
          VERSION: ${{ needs.stage.outputs.version }}
        run: |
          set -euo pipefail
          latest_tag="nightly-latest"
          title="Lampcord Nightly (Latest)"

          echo "Nightly release build complete for version $VERSION ($TAG)."

          mkdir -p release-assets
          mkdir -p nightly-latest-assets
          gh release download "$TAG" --dir release-assets --repo "$GITHUB_REPOSITORY" || true

          shopt -s nullglob
          apk=(release-assets/lampcord-android-*.apk)
          appimage=(release-assets/lampcord-desktop-linux-x64-*.AppImage)
          winzip=(release-assets/lampcord-desktop-windows-x64-*.zip)
          dmg=(release-assets/lampcord-desktop-macos-*.dmg)
          ipa=(release-assets/lampcord-ios-*.ipa release-assets/Lampcord.ipa)
          shopt -u nullglob

          [[ ${#apk[@]} -gt 0 ]] && cp "${apk[0]}" nightly-latest-assets/lampcord-android-nightly.apk
          [[ ${#appimage[@]} -gt 0 ]] && cp "${appimage[0]}" nightly-latest-assets/lampcord-desktop-linux-x64-nightly.AppImage
          [[ ${#winzip[@]} -gt 0 ]] && cp "${winzip[0]}" nightly-latest-assets/lampcord-desktop-windows-x64-nightly.zip
          [[ ${#dmg[@]} -gt 0 ]] && cp "${dmg[0]}" nightly-latest-assets/lampcord-desktop-macos-nightly.dmg
          [[ ${#ipa[@]} -gt 0 ]] && cp "${ipa[0]}" nightly-latest-assets/lampcord-ios-nightly.ipa

          if gh release view "$latest_tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$latest_tag" --target "$GITHUB_SHA" --prerelease --title "$title" --notes "Latest automated nightly build ($VERSION) from commit \`$GITHUB_SHA\`." --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$latest_tag" --prerelease --target "$GITHUB_SHA" --title "$title" --notes "Latest automated nightly build ($VERSION) from commit \`$GITHUB_SHA\`." --repo "$GITHUB_REPOSITORY"
          fi

          if ls nightly-latest-assets/* >/dev/null 2>&1; then
            gh release upload "$latest_tag" nightly-latest-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          fi

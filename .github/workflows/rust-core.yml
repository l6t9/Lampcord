name: Requiem Desktop

on:
  push:
    branches: [wip/requiem-desktop-core]
    paths:
      - "rust/**"
      - ".github/workflows/rust-core.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-core.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Check TSX runtime
        run: cargo check -p requiem-tsx
      - name: Check desktop shell
        run: cargo check -p requiem
      - name: Test TSX runtime
        run: cargo test -p requiem-tsx
      - name: Test core UI glue
        run: cargo test -p requiem-core --features sound --lib ui_tsx
      - name: Build release binary
        run: cargo build --release -p requiem

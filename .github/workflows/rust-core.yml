name: Rust Core

on:
  push:
    branches: [rewrite/rust-core]
    paths:
      - "rust/**"
      - ".github/workflows/rust-core.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-core.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check -p lampcord-model -p lampcord-core -p lampcord-transport -p lampcord-ffi
      - name: Test
        run: cargo test -p lampcord-model -p lampcord-core -p lampcord-transport -p lampcord-ffi
      - name: Build FFI (uniffi)
        run: cargo build -p lampcord-ffi --features uniffi

  smoke-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Rust FFI
        run: cargo build -p lampcord-ffi --features uniffi
        working-directory: rust
      - name: Generate Kotlin bindings
        run: cargo run -p lampcord-ffi --features bindgen -- generate --library target/debug/liblampcord_ffi.so --language kotlin --out-dir ../shared/src/desktopMain/kotlin
        working-directory: rust
      - name: JVM smoke test
        run: ./gradlew :desktopApp:smokeRustFfi --console=plain
      - name: Upload FFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: lampcord-ffi-linux-x86-64
          path: rust/target/debug/liblampcord_ffi.so
          if-no-files-found: error

name: Reusable iOS Build

on:
  workflow_call:
    inputs:
      upload-artifact:
        description: Upload the built app as a workflow artifact
        required: false
        default: false
        type: boolean
      artifact-prefix:
        description: Prefix for workflow artifact names
        required: false
        default: ''
        type: string
      build-ipa:
        description: Archive an unsigned IPA instead of only compiling for the simulator
        required: false
        default: false
        type: boolean
      staging-release-tag:
        description: Draft release tag used for cross-job package handoff
        required: false
        default: ''
        type: string
      cache-read-only:
        description: Keep the Gradle cache read-only
        required: false
        default: false
        type: boolean
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

jobs:
  build:
    name: iOS
    runs-on: macos-15
    # The archive step alone has been observed at 46 minutes, so the old 60 minute ceiling
    # cancelled the job mid-link. Kept well clear of GitHub's 6 hour hard limit.
    timeout-minutes: 120
    env:
      # Kotlin/Native's linker runs inside the Gradle daemon, so this is the heap that has to
      # survive the framework link. The fixed 4 GB in gradle.properties is nowhere near
      # enough. Scaling to the runner leaves room for the Kotlin daemon and the linker's own
      # native allocations, and capping workers stops a second native compilation from
      # competing for the same memory. Overrides gradle.properties for this job only.
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-XX:MaxRAMPercentage=25.0 -XX:+UseParallelGC -Dkotlin.daemon.jvm.options=-XX:MaxRAMPercentage=55.0 -XX:+UseParallelGC"
      ORG_GRADLE_PROJECT_org.gradle.workers.max: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Restore Kotlin/Native toolchain
        # Kotlin/Native keeps its compiler distribution, LLVM and sysroot in ~/.konan, which
        # is outside GRADLE_USER_HOME and so was not covered by the Gradle cache. Every run
        # was re-downloading and re-extracting roughly a gigabyte of LLVM before it could
        # compile anything. Keyed on the Kotlin version so a bump invalidates it.
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Validate build script
        shell: bash
        run: |
          bash -n scripts/build_ios.sh
          chmod +x scripts/build_ios.sh

      - name: Prepare CI Gradle
        uses: ./.github/actions/prepare-ci-gradle
        with:
          cache-scope: ios-build
          cache-read-only: ${{ inputs.cache-read-only }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Verify Xcode device SDK
        shell: bash
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Validate Swift syntax
        shell: bash
        run: |
          echo "Validating Swift source files in iosApp/..."
          swift --version
          find iosApp -name "*.swift" -print0 \
            | xargs -0 xcrun --sdk iphonesimulator swiftc -target arm64-apple-ios17.0-simulator -parse
          echo "Static Swift validation passed."

      - name: Compile the shared module for iOS
        # Skipped whenever a device IPA is being built. The Xcode build phase links the
        # Release device framework, so in that mode nothing consumes the debug simulator
        # framework and linking it here is ~10 minutes of work with no consumer.
        # Metrolist-KMP has no equivalent step at all.
        if: ${{ !inputs.build-ipa }}
        shell: bash
        run: |
          # Only the simulator framework is needed here. The device framework is linked by the
          # Xcode build phase for the configuration being built: Release for --ipa, and the
          # simulator app uses this same debug simulator framework. Nothing ever builds a Debug
          # device configuration, so linking one cost minutes per run for no consumer.
          # No --no-daemon: the Kotlin docs list org.gradle.daemon=false as a stale
          # workaround that disables a performance feature. Keeping the daemon lets this step,
          # the test step and the framework link inside the Xcode build phase share one JVM
          # instead of forking a fresh single-use daemon per invocation.
          # org.gradle.workers.max above is what actually bounds memory.
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Run iOS tests
        # Skipped for IPA builds. The archive already spends ~46 minutes linking the device
        # framework, and these tests boot a simulator and compile the simulator test binary
        # first, which is what pushed the combined job past its ceiling. The simulator
        # framework they exercise is not the one the IPA ships, so they do not gate it.
        if: ${{ !inputs.build-ipa }}
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(device["udid"] for runtime, items in devices.items() if ".iOS-" in runtime for device in items if device["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$device" -b
          ./gradlew :shared:iosSimulatorArm64Test --device "$device"

      - name: Shut down iOS simulator
        if: always()
        shell: bash
        run: |
          device=$(xcrun simctl list devices booted --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next((device["udid"] for runtime, items in devices.items() if ".iOS-" in runtime for device in items if device["state"] == "Booted"), ""))')
          if [ -n "$device" ]; then
            xcrun simctl shutdown "$device"
          fi

      - name: Build iOS IPA
        if: inputs.build-ipa
        shell: bash
        run: ./scripts/build_ios.sh --ipa

      - name: Build iOS simulator app
        if: ${{ !inputs.build-ipa }}
        shell: bash
        run: ./scripts/build_ios.sh --sim

      - name: Upload iOS IPA artifact
        if: ${{ inputs.upload-artifact && inputs.build-ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}ios-ipa
          path: dist/Lampcord.ipa
          if-no-files-found: error
          retention-days: 4

      - name: Upload iOS simulator artifact
        if: ${{ inputs.upload-artifact && !inputs.build-ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}ios-app
          path: dist/Lampcord.app
          if-no-files-found: error
          retention-days: 4

      - name: Upload iOS staging asset
        if: inputs.staging-release-tag != '' && inputs.build-ipa
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
        run: gh release upload "$STAGING_RELEASE_TAG" dist/Lampcord.ipa --clobber --repo "$GITHUB_REPOSITORY"

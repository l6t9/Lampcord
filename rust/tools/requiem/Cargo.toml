[package]
name = "requiem-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "requiem dev CLI (run as `cargo requiem`): asset manifests, build environment, doctor"

[[bin]]
name = "requiem"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
requiem-asset-build = { workspace = true }
requiem-assets = { workspace = true }
clap = { workspace = true, features = ["derive"] }
requiem-emoji = { workspace = true }
requiem-core = { workspace = true }
wreq.workspace = true
requiem-plugin-host = { workspace = true }
image = { workspace = true, features = ["png", "gif", "webp"] }
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "sync"] }
webp.workspace = true
requiem-update = { workspace = true }
base64.workspace = true
getrandom.workspace = true
semver.workspace = true
sha2.workspace = true
zip = { workspace = true, features = ["deflate"] }

[lints]
workspace = true

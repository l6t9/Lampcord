[package]
name = "requiem-update-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Takes signed releases from CI and serves the update backend's static files (keys, feeds, release zips, identity). Verifies everything it publishes."

[dependencies]
async-trait.workspace = true
axum.workspace = true
env_logger.workspace = true
futures-util.workspace = true
jsonwebtoken.workspace = true
log.workspace = true
reqwest = { workspace = true, features = ["json"] }
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs"] }
requiem-update = { workspace = true }

[dev-dependencies]
http-body-util.workspace = true
base64.workspace = true

[lints]
workspace = true

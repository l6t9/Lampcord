[package]
name = "lampcord-qml"
description = "Qt Quick (QML) shell for Lampcord, driven by lampcord-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
# material-colors needs 1.97 for the 2025 colour spec.
rust-version = "1.97"

[lib]
name = "lampcord_qml"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "lampcord-qml"
path = "src/main.rs"

[dependencies]
lampcord-ffi = { path = "../lampcord-ffi" }
cxx = "1.0.95"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde_json.workspace = true
qrcode = { version = "0.14", default-features = false }
material-colors = { version = "0.5", features = ["quantize"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "rayon"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

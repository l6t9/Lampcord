[package]
name = "lampcord-ffi"
description = "UI-agnostic FFI facade for Lampcord core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
name = "ffi-bench"
path = "src/bin/ffi_bench.rs"
required-features = ["bench"]

[features]
default = []
uniffi = ["dep:uniffi"]
bindgen = ["uniffi", "uniffi/cli"]
bench = []

[dependencies]
lampcord-core.workspace = true
lampcord-model.workspace = true
lampcord-transport = { path = "../lampcord-transport" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait.workspace = true
base64.workspace = true
thiserror = "2"
uniffi = { version = "0.28", optional = true }

[workspace]
resolver = "2"
members = [".", "build-support", "examples/*"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.lints.clippy]
absolute_paths = "deny"

[package]
name = "requiem-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "SDK for writing requiem plugins in Rust"

[dependencies]
wit-bindgen = { version = "0.62", default-features = false, features = ["macros", "realloc", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[lints]
workspace = true

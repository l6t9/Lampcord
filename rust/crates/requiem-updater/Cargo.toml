[package]
name = "requiem-updater"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The client side of updates: fetch signed documents from the configured backends, check for a release, download and stage it. No UI."

[dependencies]
requiem-db = { workspace = true }
futures-util.workspace = true
log.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync", "rt", "macros", "fs"] }
requiem-update = { workspace = true }
wreq = { workspace = true, features = ["stream"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time", "sync", "rt", "rt-multi-thread", "macros", "fs", "net", "io-util"] }
zip = { workspace = true, features = ["deflate"] }

[lints]
workspace = true

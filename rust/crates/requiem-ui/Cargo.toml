[package]
name = "requiem-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Discord-agnostic UI engine: winit + Skia + taffy + CSS theming"

[features]
test-hooks = []
fps-overlay = []

[dependencies]
arboard.workspace = true
requiem-i18n = { workspace = true }
usvg = { workspace = true }
base64.workspace = true
cosmic-text.workspace = true
cssparser.workspace = true
env_logger.workspace = true
gl.workspace = true
glutin.workspace = true
glutin-winit.workspace = true
log.workspace = true
moka = { workspace = true, features = ["sync"] }
precomputed-hash.workspace = true
raw-window-handle.workspace = true
selectors.workspace = true
serde_json.workspace = true
skia-safe = { workspace = true, features = ["gl", "textlayout", "skottie", "webp-decode"] }
slotmap.workspace = true
swash.workspace = true
taffy.workspace = true
unicode-segmentation.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation", "Win32_System_Memory", "Win32_System_LibraryLoader"] }

[build-dependencies]
requiem-icons = { workspace = true }
requiem-css = { workspace = true }

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    "crates/lampcord-model",
    "crates/lampcord-core",
    "apps/lampcord-gpui",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.100"

[workspace.dependencies]
lampcord-model = { path = "crates/lampcord-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui = { version = "0.2.2", default-features = false, features = ["x11"] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }

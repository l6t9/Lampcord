[workspace]
resolver = "3"
members = [
    "crates/lampcord-model",
    "crates/lampcord-core",
    "crates/lampcord-transport",
    "apps/lampcord-gpui",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.100"

[workspace.dependencies]
lampcord-model = { path = "crates/lampcord-model" }
lampcord-core = { path = "crates/lampcord-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
futures-util = "0.3"
gpui = { version = "0.2.2", default-features = false, features = [
    "wayland",
    "x11",
] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }

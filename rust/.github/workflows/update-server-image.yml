name: Update server image

on:
  push:
    branches: [mistress]
    paths:
      - 'crates/requiem-update-server/**'
      - 'crates/requiem-update/**'
      - 'Cargo.lock'
      - '.github/workflows/update-server-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase the registry owner
        id: owner
        run: echo "lower=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/requiem-update-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/requiem-update-server:latest
            ghcr.io/${{ steps.owner.outputs.lower }}/requiem-update-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

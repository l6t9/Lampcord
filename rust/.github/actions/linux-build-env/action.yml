name: Linux build environment
description: System packages and the FFmpeg shared build the client needs on Linux. Run it after checkout.

inputs:
  ffmpeg-url:
    description: Download URL of the FFmpeg shared build.
    required: true

runs:
  using: composite
  steps:
    - name: Install system packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang libclang-dev cmake ninja-build pkg-config python3 zip \
          libfontconfig1-dev libfreetype-dev libgl1-mesa-dev \
          libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
          libxkbcommon-dev libwayland-dev \
          libssl-dev libdbus-1-dev libasound2-dev \
          libgtk-3-dev libwebkit2gtk-4.1-dev

    - name: Download FFmpeg
      shell: bash
      env:
        FFMPEG_URL: ${{ inputs.ffmpeg-url }}
      run: |
        mkdir -p "$RUNNER_TEMP/ffmpeg"
        curl -fsSL "$FFMPEG_URL" | tar -xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
        echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
